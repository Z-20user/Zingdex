<link rel="stylesheet" href="assets/fonts.css?v=3.21.5">
<script>
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem("tr-settings") || "{}");
      var t = s.theme || "light";
      if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      var h = document.documentElement;
      h.dataset.theme = t;
      if (s.density) h.dataset.density = s.density;
      if (s.fs) h.dataset.fs = s.fs;
      if (s.lh) h.dataset.lh = s.lh;
      if (s.motion) h.dataset.motionPref = s.motion;
      if (s.cardAnim) h.dataset.cardAnim = s.cardAnim;
      if (s.cardSize) h.dataset.cardSize = s.cardSize;
      if (s.codeFont) h.dataset.codeFont = s.codeFont;
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
<link rel="stylesheet" href="assets/style.css?v=3.21.5">
<link rel="stylesheet" href="assets/theme.css?v=3.21.5">
