<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>组件库 — Zingdex · 跃索</title>
<meta name="description" content="7,676 个可复制、可运行的动效：基础组件、精选源码、手写关键帧、重特效与场景规格。完全离线。">
<link rel="stylesheet" href="assets/fonts.css?v=3.21.5">
<script>
  (function () {
    try {
      var saved = localStorage.getItem("tr-theme");
      var theme = saved || "light";
      document.documentElement.dataset.theme = theme;
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
<link rel="stylesheet" href="assets/style.css?v=3.21.5">
<link rel="stylesheet" href="assets/theme.css?v=3.21.5">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C6F24C">
<meta name="application-name" content="Zingdex 跃索">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zingdex">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body data-page="library">

<div data-nav></div>

<main class="wrap">
  <header class="page-head">
    <span class="crumb"><a href="index.html">首页</a><span class="sep">/</span><span>组件库</span></span>
    <div class="page-head__row">
      <div>
        <h1 class="h1" style="font-size:clamp(34px,4.6vw,60px)">组件库</h1>
        <p class="lede" style="margin-top:16px">全部条目都能直接运行、直接复制。代码就是卡片里正在跑的那一份。</p>
      </div>
      <div style="text-align:right">
        <div class="stat__v is-acc" data-lib-count>0</div>
        <div class="stat__l">个匹配结果</div>
      </div>
    </div>
  </header>

  <div class="libbar">
    <div class="libbar__search">
      <label class="search-pill">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="6" cy="6" r="4.6" stroke="#6C7280" stroke-width="1.4"/>
          <path d="M9.6 9.6L12.6 12.6" stroke="#6C7280" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input type="search" placeholder="搜索名称、分类…" aria-label="搜索组件" data-lib-search>
      </label>
      <button class="libbar__clear" type="button" data-lib-clear hidden>清除组合</button>
    </div>
    <div class="libtabs" data-lib-tabs role="tablist" aria-label="组件来源"></div>
  </div>

  <!-- 两级筛选：设备与分类可以任意组合，结果是两者的交集 -->
  <div class="librow" data-dev-row>
    <span class="librow__lb">设备</span>
    <div class="devchips" data-dev-chips></div>
  </div>
  <div class="librow">
    <span class="librow__lb">分类</span>
    <div class="devchips" data-cat-chips></div>
  </div>

  <p class="libmeta"><span data-lib-group-hint></span></p>

  <div class="lib-grid" data-lib-grid></div>

  <div style="display:flex;justify-content:center;padding:18px 0 40px">
    <button class="btn btn--ghost btn--sm" data-more style="display:none">加载更多</button>
  </div>
</main>

<div data-footer></div>

<script>
/* PWA：注册 Service Worker（file:// 与 WebView 内自动跳过） */
(function () {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol !== "http:" && location.protocol !== "https:") return;
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
  });
})();
</script>
