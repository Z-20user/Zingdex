name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"   # 每周一凌晨，避开整点

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: 静态分析（${{ matrix.language }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # 安卓端是免 Gradle 的手工构建链（aapt2 + javac + d8），
          # CodeQL 的 autobuild 找不到构建系统会直接失败。
          # 用 none 模式做纯源码抽取，不执行任何构建。
          - language: java-kotlin
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
